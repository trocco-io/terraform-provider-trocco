name: Sync to mirror

on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Serialize syncs so a branch push and a tag push cannot race.
concurrency:
  group: sync-to-mirror

permissions:
  contents: read

jobs:
  sync:
    # Guard: this workflow must run only on the private (development) side.
    if: github.repository == 'primenumber-dev/terraform-provider-trocco'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: trocco-io
          repositories: terraform-provider-trocco
      # fetch-depth: 0 fetches all branches and tags so both refs can be pushed together.
      # persist-credentials: false keeps GITHUB_TOKEN out of git config; otherwise the
      # persisted extraheader overrides the app token embedded in the mirror remote URL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main and release tags to the mirror
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # On tag-push events the checkout is a detached HEAD and refs/heads/main
          # does not exist locally, so push from the remote-tracking ref instead.
          git remote add mirror "https://x-access-token:${TOKEN}@github.com/trocco-io/terraform-provider-trocco.git"
          git push mirror 'refs/remotes/origin/main:refs/heads/main' 'refs/tags/v*:refs/tags/v*'
