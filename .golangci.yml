version: "2"

linters:
  enable:
    - "bodyclose"
    - "contextcheck"
    - "durationcheck"
    - "errorlint"
    - "forcetypeassert"
    - "gocritic"
    - "godot"
    - "gosec"
    - "ineffassign"
    - "makezero"
    - "misspell"
    - "nilerr"
    - "predeclared"
    - "staticcheck"
    - "testifylint"
    - "thelper"
    - "unconvert"
    - "unparam"
  exclusions:
    rules:
      # Test mock servers encode fixture entities that contain secret-like
      # fields such as API keys, which are not real secrets.
      - path: _test\.go
        linters:
          - gosec
        text: "G117:"
